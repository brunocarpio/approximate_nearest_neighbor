[project]
name = "approximate_nearest_neighbor"
version = "0.1.0"
description = "Python implementation of the approximate nearest neighbor algorithm as discribed in https://www.sciencedirect.com/science/article/abs/pii/S0306437913001300?via%3Dihub"
readme = "README.md"
authors = [
    { name = "Bruno Carpio", email = "bcluna@pm.me" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "sortedcontainers>=2.4.0",
    "tensorflow>=2.21.0",
    "tensorflow-hub>=0.16.1",
    # tensorflow-hub imports pkg_resources, which setuptools removed in 82.0.0.
    "setuptools<82",
]

[project.scripts]
ann = "approximate_nearest_neighbor:main"
ann-test = "approximate_nearest_neighbor.testing:run"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
